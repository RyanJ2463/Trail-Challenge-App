<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{ --bg:#f6f7f2; --surface:#fff; --border:#e2e5dd; --text:#1c231d; --muted:#5c6b5e; --primary:#2f6f4f; --primaryDark:#234f39; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:32px}
  h1{font-size:18px;margin:0 0 4px}
  p{color:var(--muted);font-size:13px;margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .cell{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .row{display:flex;align-items:flex-end;gap:14px;height:30px}
  .ico{color:var(--primary)}
  .ico.sm{color:var(--muted)}
  .chip{background:var(--primaryDark);border-radius:8px;padding:5px;display:flex}
  .chip .ico{color:#fff}
  .name{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  svg{display:block}
</style>
</head>
<body>
<h1>Trail Challenge — icon set</h1>
<p>24px grid · 2px stroke · round caps · currentColor · geometric "field-survey" style.
Source of truth for the artwork; the same paths live in <code>components/Icon.tsx</code>.</p>
<div class="grid" id="grid"></div>

<script>
// path/markup for each icon, drawn on a 24x24 grid
const ICONS = {

  leaderboard: `<path d="M4 20.5h16"/><path d="M6.5 20.5v-6"/><path d="M12 20.5V8.5"/><path d="M17.5 20.5v-9"/><path d="M12 8.5V4.5l3.2 1.2L12 7"/>`,
  friends: `<circle cx="8.2" cy="7.4" r="2.2"/><path d="M3.9 18c0-2.5 1.8-4.4 4.2-4.6"/><circle cx="15" cy="8.3" r="2.5"/><path d="M9.3 19.2c0-3.3 2.5-5.4 5.6-5.4s5.6 2.1 5.6 5.4"/>`,
  profile: `<circle cx="12" cy="8" r="3.3"/><path d="M5.5 20.2c0-3.7 2.9-6.4 6.5-6.4s6.5 2.7 6.5 6.4"/>`,
  hiking: `<path d="M6 15.5V7.2C6 5.7 6.8 4.8 8.3 5 9.3 5.2 9.8 6 10 7.3c.3 1.9.8 3.3 2.3 4.3"/><path d="M12.3 11.6c1.4.8 3.2 1.2 5.2 1.4 2 .2 3.5 1.2 3.5 3v.7H3.5c-.6 0-1-.5-1-1.4V16c0-1.3.7-2 2-2h8"/><path d="M6 15.5h15.3"/><path d="M8.9 7.6l1.8.9M8.7 10l2.1 1"/>`,
  running: `<circle cx="15" cy="4.9" r="1.85" fill="currentColor" stroke="none"/><path d="M14 7.3 12.1 11 8.3 12.1M12.1 11l2.6 2.8-1.8 5.2M12.1 11l3.6-.6 2.9 3.7M15 8.2l2.9 1 1.9-1.9"/>`,
  walking: `<circle cx="12.7" cy="5.1" r="1.75" fill="currentColor" stroke="none"/><path d="M12.6 7.6 11.7 13.3M11.7 13.3 13.7 15.3 13.3 19.9M11.7 13.3 9.3 15.9 9.8 19.9M12.3 9.4 9.4 8.5M12.3 9.7 14.4 10.7 15.6 12.3"/>`,
  cycling: `<circle cx="6" cy="16.5" r="4"/><circle cx="18" cy="16.5" r="4"/><path d="M6 16.5 10.5 8H15M10.5 8l4 8.5M8.5 8H12"/><circle cx="15" cy="5.5" r="1.4"/>`,
  steps: `<path d="M12.6 3.2c2 0 3.3 1.7 3.3 4.2 0 1.3-.4 1.9-.4 3.1 0 2-1.2 3.3-2.9 3.3s-2.9-1.3-2.9-3.3c0-1.2-.4-1.8-.4-3.1 0-2.5 1.3-4.2 3.2-4.2Z"/><path d="M9.6 10h6"/><path d="M8 12.6c2 0 3.3 1.7 3.3 4.2 0 1.3-.4 1.9-.4 3.1 0 2-1.2 3.3-2.9 3.3s-2.9-1.3-2.9-3.3c0-1.2-.4-1.8-.4-3.1 0-2.5 1.3-4.2 3.2-4.2Z"/><path d="M5 19.4h6"/>`,
  sync: `<path d="M20 7.5A8.5 8.5 0 0 0 5 6.2M4 16.5A8.5 8.5 0 0 0 19 17.8"/><path d="M20 3.5V8h-4.5M4 20.5V16h4.5"/>`,
  mountain: `<path d="M2 20.5 8.5 9l3.5 6"/><path d="M9.5 20.5 15.5 9.5 22 20.5Z"/><path d="M13.6 13l1.9 1.3 1.7-1"/>`,
  flag: `<path d="M6.5 21V4"/><path d="M6.5 5h9.5l-2.2 3.3L16 11.5H6.5"/>`,
  mail: `<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M4 8l8 5.5L20 8"/>`,
  route: `<path d="M5 19.5C9.5 19.5 8.5 12 12.5 11S16.5 4.5 20 4.5" stroke-dasharray="0.4 3.8" stroke-width="2.2"/><circle cx="5" cy="19.5" r="1.9"/><circle cx="20" cy="4.5" r="1.9" fill="currentColor" stroke="none"/>`,
  check: `<path d="M4 12.5 9.5 18 20 6.5"/>`,
  info: `<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/>`,
  plus: `<path d="M12 5v14M5 12h14"/>`,
  'chevron-right': `<path d="M9 5l7 7-7 7"/>`,
  'chevron-left': `<path d="M15 5l-7 7 7 7"/>`,
  lock: `<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/>`,
  search: `<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>`,
  'sign-out': `<path d="M14 8V5.5A1.5 1.5 0 0 0 12.5 4h-7A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20h7A1.5 1.5 0 0 0 14 18.5V16"/><path d="M9 12h11m-4-4 4 4-4 4"/>`,
  'rank-1': `<path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7Z"/><path d="M11 9.5 13 8.5V16" stroke-width="1.6"/>`,
  'rank-2': `<path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7Z"/><path d="M9.8 9.8a2.2 2.2 0 1 1 4 1.3L9.6 16h4.6" stroke-width="1.6"/>`,
  'rank-3': `<path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7Z"/><path d="M9.9 9c.3-1.1 1.2-1.7 2.3-1.7 1.3 0 2.2.8 2.2 1.9 0 1-.8 1.7-2 1.8 1.4 0 2.3.8 2.3 2 0 1.2-1 2.1-2.5 2.1-1.2 0-2.2-.6-2.5-1.7" stroke-width="1.7"/>`,
};

const grid = document.getElementById('grid');
for (const [name, body] of Object.entries(ICONS)) {
  const svg = (px, cls) => `<svg class="ico ${cls||''}" width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<div class="row">${svg(24)}${svg(18,'sm')}<span class="chip">${svg(20)}</span></div><span class="name">${name}</span>`;
  grid.appendChild(cell);
}
</script>
</body>
</html>
